<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regional & International Hub - CineCrack</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="loading-overlay">
        <div class="spinner"></div>
        <p>Loading the Hub...</p>
    </div>

    <header>
        <div class="logo" onclick="window.location.href='index.html'" style="cursor: pointer;">🎬 CineCrack</div>
        <div class="market-toggle">
            <button class="market-btn" onclick="window.location.href='index.html'"><i class="fas fa-home"></i> Back to Home</button>
        </div>
    </header>

    <main style="padding-top: 20px;">
        <h1 style="font-size: 42px; margin-bottom: 40px; text-align: center;">🌍 The Cinema Hub</h1>

        <div class="movie-row-container">
            <h2>Trending in Tollywood</h2>
            <div class="movie-row" id="row-tollywood"></div>
        </div>

        <div class="movie-row-container">
            <h2>Bollywood Blockbusters</h2>
            <div class="movie-row" id="row-bollywood"></div>
        </div>

        <div class="movie-row-container">
            <h2>Kollywood Hits</h2>
            <div class="movie-row" id="row-kollywood"></div>
        </div>

        <div class="movie-row-container">
            <h2>Mollywood Hits</h2>
            <div class="movie-row" id="row-mollywood"></div>
        </div>

        <div class="movie-row-container">
            <h2>Top Rated International (KR, JP, FR, ES)</h2>
            <div class="movie-row" id="row-international"></div>
        </div>
    </main>

    <script src="regional.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cinecrack</title>
    <script>
      // Apply the persisted theme before paint to avoid a light-mode flash on reload.
      (function () {
        try {
          var raw = localStorage.getItem('cinecrack-theme-storage');
          if (raw && JSON.parse(raw).state.theme === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineCrack Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="loading-overlay" class="hidden">
        <div class="spinner"></div>
        <p>Fetching movies...</p>
    </div>
    <header>
        <div class="logo" onclick="resetToHome()" style="cursor: pointer;">🎬 CineCrack</div>
        
        <div class="market-toggle">
            <button id="btn-US" class="market-btn" onclick="switchMarket('US')">🇺🇸 US</button>
            <button id="btn-IN" class="market-btn" onclick="switchMarket('IN')">🇮🇳 India</button>
        </div>

        <div id="regional-filters" style="display: none; gap: 10px; margin-top: 15px; justify-content: center;">
            <button class="lang-btn active" onclick="filterLanguage('all')">All</button>
            <button class="lang-btn" onclick="filterLanguage('te')">Telugu</button>
            <button class="lang-btn" onclick="filterLanguage('hi')">Hindi</button>
            <button class="lang-btn" onclick="filterLanguage('ta')">Tamil</button>
            <button class="lang-btn" onclick="filterLanguage('ml')">Malayalam</button>
        </div>

        <div class="search-bar">
            <input type="text" id="movie-search-input" placeholder="Search for a movie...">
            <button onclick="executeSearch()">Search</button>
        </div>
    </header>

    <main>
        <section id="home-view">
            
            <div class="recent-searches-container" id="recent-searches-section" style="display: none; padding-bottom: 20px;">
                <h3 style="margin-bottom: 15px; color: #a0a0a0; font-weight: 600;">
                    <i class="fas fa-history"></i> Recent Searches
                </h3>
                <div class="tags" id="history-tags" style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 30px;">
                    </div>
            </div>

            <h2 class="section-title">Now Playing in Theaters</h2>
            <div class="grid-container" id="now-playing-grid"></div>

            <div id="bottom-loading" class="hidden" style="text-align: center; padding: 40px 0; width: 100%;">
                <i class="fas fa-spinner fa-spin fa-2x" style="color: var(--accent);"></i>
            </div>
            
        </section>

        <section id="detail-view" class="hidden">
            <button class="back-btn" onclick="showHomeView()"><i class="fas fa-arrow-left"></i> Back to Home</button>
            
            <div class="hero-section">
                <img id="movie-poster" src="" alt="Movie Poster">
                <div class="movie-info">
                    <h1 id="movie-title">Loading...</h1>
                    <div class="tags" id="movie-genres"></div>
                    <div class="release-info">
                        <p><i class="fas fa-calendar-alt"></i> <strong>Theatrical Release:</strong> <span id="theatre-date"></span></p>
                        <p><i class="fas fa-tv"></i> <strong>Streaming On:</strong> <span id="ott-platforms"></span></p>
                    </div>
                    <h3>Storyline</h3>
                    <p id="movie-storyline" class="storyline"></p>
                </div>
            </div>

            <hr>

            <div class="people-section">
                <h2>Lead Cast</h2>
                <div class="grid-container" id="cast-grid"></div>
            </div>

            <div class="people-section">
                <h2>Key Technicians</h2>
                <div class="grid-container" id="technician-grid"></div>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (() => {
            try {
                const key = "cinecrack-theme";
                const savedTheme = localStorage.getItem(key);
                const preferredDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
                const initialTheme = savedTheme === "dark" || savedTheme === "light"
                    ? savedTheme
                    : (preferredDark ? "dark" : "light");
                document.documentElement.setAttribute("data-theme", initialTheme);
                document.documentElement.classList.toggle("dark-theme", initialTheme === "dark");
            } catch (error) {
                document.documentElement.setAttribute("data-theme", "light");
            }
        })();
    </script>
    <title>AI Guru - CineCrack</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=20260314a">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="logo" onclick="window.location.href='index.html'">🎬 CineCrack</div>
            <nav>
                <a href="index.html" class="nav-link"><i class="fas fa-home"></i> Home</a>
                <a href="regional.html" class="nav-link"><i class="fas fa-globe-americas"></i> Cinema Hub</a>
                <a href="discover.html" class="nav-link"><i class="fas fa-compass"></i> Discover</a>
                <a href="ai-guru.html" class="nav-link active"><i class="fas fa-magic"></i> AI Guru</a>
            </nav>
            <div class="sidebar-bottom">
                <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode"></button>
            </div>
        </aside>

        <main class="main-content">
            <h1 style="font-size: 42px; margin-bottom: 10px; color: var(--text-main);">AI Cinema Guru</h1>
            <p style="margin-top: 0; color: var(--text-muted); margin-bottom: 22px;">
                Ask for precise, mood-driven, story-specific movie recommendations.
            </p>

            <section class="ai-guru-shell">
                <div id="ai-chat-thread" class="ai-chat-thread">
                    <article class="chat-message ai-message">
                        <div class="chat-bubble">
                            <p>Welcome. Describe a vibe, character arc, ending tone, or visual atmosphere, and I will curate cinematic matches.</p>
                        </div>
                    </article>
                </div>

                <form id="ai-chat-form" class="ai-chat-form">
                    <textarea
                        id="ai-query-input"
                        class="ai-query-input"
                        rows="2"
                        placeholder="Try: Dark sci-fi with morally conflicted AI and a hopeful ending..."
                        required
                    ></textarea>
                    <button id="ai-send-btn" type="submit"><i class="fas fa-paper-plane"></i> Summon</button>
                </form>
            </section>
        </main>
    </div>

    <script src="js/theme.js?v=20260308b"></script>
    <script src="js/ai-guru.js"></script>
</body>
</html>

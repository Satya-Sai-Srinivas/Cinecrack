<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (() => {
            try {
                const key = "cinecrack-theme";
                const savedTheme = localStorage.getItem(key);
                const preferredDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
                const initialTheme = savedTheme === "dark" || savedTheme === "light"
                    ? savedTheme
                    : (preferredDark ? "dark" : "light");
                document.documentElement.setAttribute("data-theme", initialTheme);
                document.documentElement.classList.toggle("dark-theme", initialTheme === "dark");
            } catch (error) {
                document.documentElement.setAttribute("data-theme", "light");
            }
        })();
    </script>
    <title>Profile - CineCrack</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=20260315f">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="loading-overlay">
        <div class="spinner"></div>
        <p style="font-weight: 600;">Loading profile...</p>
    </div>

    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-top">
                <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="Toggle sidebar">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="logo" onclick="window.location.href='index.html'"><span class="logo-text">CineCrack</span></div>
            </div>
            <nav>
                <a href="index.html" class="nav-link"><i class="fas fa-home"></i> <span class="nav-label">Home</span></a>
                <a href="regional.html" class="nav-link"><i class="fas fa-globe-americas"></i> <span class="nav-label">Cinema Hub</span></a>
                <a href="discover.html" class="nav-link"><i class="fas fa-compass"></i> <span class="nav-label">Discover</span></a>
            </nav>
            <div class="sidebar-bottom">
                <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode"></button>
            </div>
        </aside>

        <main class="main-content">
            <section class="person-hero" id="person-hero" style="display: none;">
                <img id="person-image" class="person-hero-img" src="" alt="Profile Picture">
                <div class="person-hero-info">
                    <h1 id="person-name">Loading...</h1>
                    <div class="person-meta">
                        <span id="person-department"><i class="fas fa-camera"></i> </span>
                        <span id="person-birthday"><i class="fas fa-birthday-cake"></i> </span>
                        <span id="person-birthplace"><i class="fas fa-map-marker-alt"></i> </span>
                    </div>
                    
                    <div class="person-socials" id="person-socials" style="margin-bottom: 25px;">
                        </div>

                    <h3 style="font-size: 20px; margin-bottom: 10px;">Biography</h3>
                    <p id="person-bio" class="person-bio"></p>
                </div>
            </section>

            <h2 class="section-title">Filmography</h2>
            <div class="grid-container" id="filmography-grid">
                </div>
        </main>
    </div>

    <script src="js/theme.js?v=20260315e"></script>
    <script src="js/person.js?v=20260315e"></script>
    <script src="js/chatbot.js?v=20260315e"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (() => {
            try {
                const key = "cinecrack-theme";
                const savedTheme = localStorage.getItem(key);
                const preferredDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
                const initialTheme = savedTheme === "dark" || savedTheme === "light"
                    ? savedTheme
                    : (preferredDark ? "dark" : "light");
                document.documentElement.setAttribute("data-theme", initialTheme);
                document.documentElement.classList.toggle("dark-theme", initialTheme === "dark");
            } catch (error) {
                document.documentElement.setAttribute("data-theme", "light");
            }
        })();
    </script>
    <title>CineCrack - Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=20260308b">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="loading-overlay" class="hidden">
        <div class="spinner"></div>
        <p style="font-weight: 600;">Fetching movies...</p>
    </div>

    <div class="layout">
        <aside class="sidebar">
            <div class="logo" onclick="resetToHome()">🎬 CineCrack</div>
            <nav>
                <a href="index.html" class="nav-link active"><i class="fas fa-home"></i> Home</a>
                <a href="regional.html" class="nav-link"><i class="fas fa-globe-americas"></i> Cinema Hub</a>
                <a href="discover.html" class="nav-link"><i class="fas fa-compass"></i> Discover</a>
            </nav>
            <div class="sidebar-bottom">
                <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark mode"></button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <div style="display: flex; gap: 15px; flex-wrap: wrap; align-items: center;">
                    <div class="market-toggle">
                        <button id="btn-US" class="market-btn" onclick="switchMarket('US')">🇺🇸 US</button>
                        <button id="btn-IN" class="market-btn" onclick="switchMarket('IN')">🇮🇳 India</button>
                    </div>

                    <div id="regional-filters">
                        <button class="lang-btn active" onclick="filterLanguage('all')">All</button>
                        <button class="lang-btn" onclick="filterLanguage('te')">Telugu</button>
                        <button class="lang-btn" onclick="filterLanguage('hi')">Hindi</button>
                        <button class="lang-btn" onclick="filterLanguage('ta')">Tamil</button>
                        <button class="lang-btn" onclick="filterLanguage('ml')">Malayalam</button>
                    </div>
                </div>

                <div class="search-bar">
                    <input type="text" id="movie-search-input" placeholder="Search for a movie...">
                    <button onclick="executeSearch()">Search</button>
                </div>
            </header>

            <section id="home-view">
                <div class="recent-searches-container" id="recent-searches-section" style="display: none; padding-bottom: 20px;">
                    <h3 style="margin-bottom: 15px; color: var(--text-muted); font-weight: 600; font-size: 16px;">
                        <i class="fas fa-history"></i> Recent Searches
                    </h3>
                    <div class="tags" id="history-tags" style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 30px;">
                    </div>
                </div>

                <h2 class="section-title">Now Playing in Theaters</h2>
                <div class="grid-container" id="now-playing-grid"></div>

                <div id="bottom-loading" class="hidden" style="text-align: center; padding: 40px 0; width: 100%;">
                    <i class="fas fa-spinner fa-spin fa-2x" style="color: var(--accent);"></i>
                </div>
            </section>

            <section id="detail-view" class="hidden">
                <div class="hero-section">
                    <img id="movie-poster" src="" alt="Movie Poster">
                    <div class="movie-info">
                        <h1 id="movie-title">Loading...</h1>
                        <div class="tags" id="movie-genres"></div>
                        <div class="release-info">
                            <p><i class="fas fa-calendar-alt"></i> <strong>Theatrical Release:</strong> <span id="theatre-date"></span></p>
                            <p><i class="fas fa-tv"></i> <strong>Streaming On:</strong> <span id="ott-platforms"></span></p>
                        </div>
                        <h3 style="font-size: 20px; margin-bottom: 10px;">Storyline</h3>
                        <p id="movie-storyline" class="storyline"></p>
                    </div>
                </div>
                <hr>
                <div class="people-section">
                    <h2>Lead Cast</h2>
                    <div class="grid-container" id="cast-grid"></div>
                </div>
                <div class="people-section">
                    <h2 style="margin-top: 40px;">Key Technicians</h2>
                    <div class="grid-container" id="technician-grid"></div>
                </div>
            </section>
        </main>
    </div>

    <script src="js/theme.js?v=20260308b"></script>
    <script src="js/app.js"></script>
</body>
</html>
